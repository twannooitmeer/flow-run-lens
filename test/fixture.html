<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Run Lens fixture</title>
  <link rel="stylesheet" href="../src/content.css">
  <style>body { margin: 0; padding: 24px; font: 14px "Segoe UI", sans-serif; } [role=row] { display: flex; gap: 24px; padding: 8px 0; border-bottom: 1px solid #eee; }</style>
  <script>
    // Stubs the extension runtime and fakes a page URL with an environment,
    // so the content script can be exercised in a plain browser tab.
    history.replaceState(null, '', location.pathname + '#/environments/Default-test/flows');
    const now = Date.now();
    const iso = (minAgo) => new Date(now - minAgo * 60000).toISOString();
    const run = (name, status, minAgo, secs, error) => ({ name, status, startTime: iso(minAgo), endTime: status === 'Running' ? null : iso(minAgo - secs / 60), durationMs: status === 'Running' ? null : secs * 1000, trigger: 'manual', errorCode: error ? 'ActionFailed' : null, errorMessage: error || null });
    const FAKE = {
      '11111111-1111-1111-1111-111111111111': [run('a3', 'Failed', 12, 8, 'The Send an email action failed: mailbox unavailable.'), run('a2', 'Succeeded', 72, 30), run('a1', 'Succeeded', 132, 28)],
      '22222222-2222-2222-2222-222222222222': [run('b2', 'Succeeded', 300, 90), run('b1', 'Succeeded', 1800, 85)],
      '33333333-3333-3333-3333-333333333333': [],
      '44444444-4444-4444-4444-444444444444': [run('d1', 'Running', 3, 0)],
    };
    window.chrome = { runtime: { lastError: null, sendMessage(msg, cb) {
      setTimeout(() => {
        if (msg.type === 'getRuns') {
          if (msg.flowId === '55555555-5555-5555-5555-555555555555') return cb({ error: 'auth' });
          cb({ summary: FlowRunLens.summarizeRuns(FAKE[msg.flowId] || []) });
        } else if (msg.type === 'listFlows') {
          cb({ flows: [{ id: '44444444-4444-4444-4444-444444444444', displayName: 'Nightly sync (no link)' }] });
        } else cb({ ok: true });
      }, 300);
    } } };
  </script>
  <script src="../src/lib/core.js"></script>
</head>
<body>
  <nav><a href="/environments/Default-test/flows/11111111-1111-1111-1111-111111111111/details">Nav link (ignored)</a></nav>
  <div role="grid">
    <div role="row"><span role="columnheader">Name</span><span role="columnheader">Modified</span></div>
    <div role="row"><span role="gridcell"><a href="/environments/Default-test/flows/11111111-1111-1111-1111-111111111111/details">Invoice approval</a></span><span role="gridcell">1 d ago</span></div>
    <div role="row"><span role="gridcell"><a href="/environments/Default-test/flows/22222222-2222-2222-2222-222222222222/details">Weekly report</a></span><span role="gridcell">3 d ago</span></div>
    <div role="row"><span role="gridcell"><a href="/environments/Default-test/flows/33333333-3333-3333-3333-333333333333/details">Dormant flow</a></span><span role="gridcell">2 mo ago</span></div>
    <div role="row"><span role="gridcell"><span>Nightly sync (no link)</span></span><span role="gridcell">5 h ago</span></div>
    <div role="row"><span role="gridcell"><a href="/environments/Default-test/flows/55555555-5555-5555-5555-555555555555/details">Needs sign-in</a></span><span role="gridcell">1 h ago</span></div>
  </div>
  <script src="../src/content.js"></script>
</body>
</html>
